name: ATMO Windows - proves i captures
on:
  push:
    branches: [atmo/interficie-primera-integracio]
    paths: ['**.py', 'atmo_assets/**', '.github/workflows/validacio-atmo-windows.yml', 'requirements*.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependències
        run: |
          python -m pip install numpy opencv-contrib-python Pillow mido==1.3.3 python-rtmidi==1.5.8 -r requirements-audio.txt
          New-Item -ItemType Directory -Force VALIDACIO/windows | Out-Null
          python -m pip freeze > VALIDACIO/windows/dependencies.txt
      - name: Compilació
        run: python -m compileall -q .
      - name: Proves completes amb Tk i SDL
        run: |
          python -m tools.provar_tests *> VALIDACIO/windows/tests.log
          $result = $LASTEXITCODE
          Get-Content VALIDACIO/windows/tests.log | Select-Object -Last 35
          exit $result
      - name: Captures de finestres Windows a tres escalats
        if: always()
        run: python -m tools.capturar_atmo --output VALIDACIO/windows/captures --scales 1 1.25 1.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atmo-windows-validacio
          path: VALIDACIO/windows
