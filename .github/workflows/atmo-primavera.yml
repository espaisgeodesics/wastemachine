name: ATMO - creacio Primavera
on:
  push:
    branches: [atmo/interficie-primera-integracio]
    paths: ['experiencies/primavera/**', '.github/workflows/atmo-primavera.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Eines de generacio i audicio
        run: |
          python -m pip install mido==1.3.3 Pillow
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfluidsynth3 timgm6mb-soundfont ffmpeg
      - name: Crear i comprovar la composicio
        run: |
          python experiencies/primavera/crear_primavera.py build/ATMO_PRIMAVERA
          cp experiencies/primavera/{COMENCA_AQUI.txt,CREDITS_I_LLICENCIA.txt,MAPA_TARGETES.csv} build/ATMO_PRIMAVERA/
          mkdir -p build/ATMO_PRIMAVERA/FONTS
          cp experiencies/primavera/FONT_MUTOPIA* build/ATMO_PRIMAVERA/FONTS/
          python experiencies/primavera/imprimir_targetes.py build/ATMO_PRIMAVERA
      - name: Renderitzar les dues audicions
        run: |
          python experiencies/primavera/renderitzar.py build/ATMO_PRIMAVERA
          ffprobe -v error -show_entries format=duration build/ATMO_PRIMAVERA/ESCOLTAR_PRIMAVERA.mp3
      - name: Empaquetar
        run: |
          cd build
          zip -qr ATMO_PRIMAVERA_CREACIO_1.zip ATMO_PRIMAVERA
          sha256sum ATMO_PRIMAVERA_CREACIO_1.zip > SHA256_PRIMAVERA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: atmo-primavera
          path: |
            build/ATMO_PRIMAVERA_CREACIO_1.zip
            build/ATMO_PRIMAVERA/ESCOLTAR_PRIMAVERA.mp3
            build/ATMO_PRIMAVERA/ESCOLTAR_INTRO.mp3
            build/ATMO_PRIMAVERA/MIDI/PRIMAVERA_5_PISTES.mid
            build/ATMO_PRIMAVERA/PRIMAVERA_ATMO.json
            build/ATMO_PRIMAVERA/COMENCA_AQUI.txt
            build/ATMO_PRIMAVERA/TARGETES_01_A_07.pdf
            build/SHA256_PRIMAVERA.txt
  publish:
    needs: create
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atmo-primavera
          path: delivery
      - name: Publicar creacio sense substituir el programa
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="atmo-primavera-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --target "$GITHUB_SHA" --latest=false --title "ATMO · La Primavera · Creacio ${GITHUB_RUN_NUMBER}" --notes "Cinc pistes MIDI de Vivaldi RV269 I Allegro amb timbres diferenciats, projecte ATMO de set targetes, audicions i guia de muntatge. Cal crear els instruments i assignacions Mute a Cakewalk; no inclou un projecte CWP preconfigurat. Adaptacio de Mutopia 301, CC BY-SA 3.0. No es una actualitzacio del programa."
          find delivery -type f -print0 | while IFS= read -r -d '' asset; do gh release upload "$tag" "$asset"; done
